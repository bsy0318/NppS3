# Local S3-compatible server for NppS3 development and integration testing.
#
# MinIO speaks the same SigV4 + ListObjectsV2 + multipart API the plugin
# targets, so the whole transfer path can be exercised without spending money
# on a hosted service such as Cloudflare R2 or Amazon S3.
#
# The credentials below are local development values for a service bound to
# 127.0.0.1 only. They are not secrets and must never be reused anywhere else.
#
#   docker compose -f tests/docker/docker-compose.yml up -d --wait
#   docker compose -f tests/docker/docker-compose.yml down -v

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: npps3local
      MINIO_ROOT_PASSWORD: npps3localsecret
      # Region is deliberately left unset so MinIO accepts any signing region,
      # matching how Cloudflare R2 treats "auto"/"us-east-1"/empty.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 npps3local npps3localsecret &&
      mc mb --ignore-existing local/npps3-test &&
      echo 'bucket npps3-test ready'
      "

volumes:
  minio-data:
