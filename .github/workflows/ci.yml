# NppS3 — build and test on every push.
# SPDX-License-Identifier: GPL-3.0-or-later

name: CI

on:
  push:
    branches: ["**"] # tag pushes are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            runner: windows-latest
          - arch: x86
            platform: Win32
            runner: windows-latest
          - arch: arm64
            platform: ARM64
            # Native ARM64 host, so the unit tests run here rather than the
            # build only proving that the tree compiles and links.
            runner: windows-11-vs2026-arm

    steps:
      - uses: actions/checkout@v7

      # No -G: the default generator follows whichever Visual Studio the runner
      # image ships, so a new image does not break the build.
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: .\build\Release\npps3_tests.exe

      - name: Stage plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/NppS3 | Out-Null
          Copy-Item build/Release/NppS3.dll stage/NppS3/

      - uses: actions/upload-artifact@v7
        with:
          name: NppS3-${{ matrix.arch }}
          path: stage/NppS3/NppS3.dll
          if-no-files-found: error

      - name: Upload test tools
        uses: actions/upload-artifact@v7
        with:
          name: npps3-tools-${{ matrix.arch }}
          path: |
            build/Release/npps3_integration.exe
            build/Release/npps3_s3cli.exe
          if-no-files-found: error

  integration:
    name: Integration (MinIO)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: npps3-tools-x64
          path: tools

      # GitHub's Windows runners only run Windows containers, so the
      # docker-compose setup used locally is replaced by the MinIO Windows
      # binary. Its filesystem backend inherits NTFS naming rules, so keys
      # holding ':' or '?' cannot be stored; the runner detects that and skips
      # those cases. The Linux container used locally covers them.
      - name: Start MinIO
        shell: pwsh
        env:
          # Pinned so a server-side change cannot alter CI results on its own.
          MINIO_RELEASE: RELEASE.2025-04-22T22-12-26Z
          MC_RELEASE: RELEASE.2025-04-16T18-13-26Z
        run: |
          Invoke-WebRequest -Uri "https://dl.min.io/server/minio/release/windows-amd64/archive/minio.$env:MINIO_RELEASE" -OutFile minio.exe
          Invoke-WebRequest -Uri "https://dl.min.io/client/mc/release/windows-amd64/archive/mc.$env:MC_RELEASE" -OutFile mc.exe
          New-Item -ItemType Directory -Force -Path minio-data | Out-Null
          $env:MINIO_ROOT_USER = 'npps3local'
          $env:MINIO_ROOT_PASSWORD = 'npps3localsecret'
          Start-Process -FilePath .\minio.exe -ArgumentList 'server','minio-data','--address','127.0.0.1:9000' -PassThru
          for ($i = 0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9000/minio/health/live -TimeoutSec 2 | Out-Null
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          .\mc.exe alias set local http://127.0.0.1:9000 npps3local npps3localsecret
          .\mc.exe mb --ignore-existing local/npps3-test

      - name: Integration tests
        shell: pwsh
        env:
          # Local-only development credentials for the throwaway MinIO above.
          # Real storage credentials never appear in this repository.
          NPPS3_TEST_ENDPOINT: http://127.0.0.1:9000
          NPPS3_TEST_ACCESS_KEY_ID: npps3local
          NPPS3_TEST_SECRET_ACCESS_KEY: npps3localsecret
          NPPS3_TEST_BUCKET: npps3-test
          NPPS3_TEST_REGION: us-east-1
        run: .\tools\npps3_integration.exe
