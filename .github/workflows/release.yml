# NppS3 — build every architecture and publish a GitHub release on a v* tag.
# SPDX-License-Identifier: GPL-3.0-or-later
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Each architecture ships as its own zip so a user can drop NppS3.dll into the
# plugins\NppS3 folder of a matching Notepad++ build.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            runnable: true
          - arch: x86
            platform: Win32
            runnable: true
          - arch: arm64
            platform: ARM64
            runnable: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No -G: the default generator follows whichever Visual Studio the runner
      # image ships, so a new image does not break the build.
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        if: matrix.runnable
        run: .\build\Release\npps3_tests.exe

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path src/plugin/Version.h -Pattern '#define NPPS3_VERSION_STR "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $name = "NppS3-$version-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "pkg/$name" | Out-Null
          Copy-Item build/Release/NppS3.dll "pkg/$name/"
          Copy-Item LICENSE* "pkg/$name/" -ErrorAction SilentlyContinue
          # Plugins Admin expects the DLL at the root of the archive.
          Compress-Archive -Path "pkg/$name/*" -DestinationPath "pkg/$name.zip"
          $hash = (Get-FileHash "pkg/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "pkg/$name.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: |
            pkg/*.zip
            pkg/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          notes=$(cat <<'EOF'
          ## Install

          Copy `NppS3.dll` into the Notepad++ plugins folder, in a directory of the same name:

          ```
          <Notepad++>\plugins\NppS3\NppS3.dll
          ```

          Pick the archive matching your Notepad++ build (x64, x86 or arm64).
          The `.sha256` files carry the checksum of each archive.
          EOF
          )
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --title "NppS3 $TAG" \
            --notes "$notes" \
            --verify-tag
