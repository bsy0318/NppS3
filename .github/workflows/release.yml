# NppS3 — publish a GitHub release whenever the version in Version.h is new.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Bump NPPS3_VERSION_STR in src/plugin/Version.h and push to main. Pushes that
# do not change the version publish nothing.
#
# The tag is created here rather than pushed separately: a tag pushed with
# GITHUB_TOKEN does not start another workflow, so a tag-triggered build would
# never run.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The tag only exists once the release is published, so a second push while a
# release is still building would not see it and would build the same version
# twice. Queue runs instead of cancelling: cancelling could drop a real release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags decide whether this version is already out

      - id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^#define NPPS3_VERSION_STR "\(.*\)"$/\1/p' src/plugin/Version.h)
          if [ -z "$version" ]; then
            echo "::error::NPPS3_VERSION_STR not found in src/plugin/Version.h"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Keying off the tag rather than a diff keeps re-runs idempotent.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released; nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is new; building the release."
          fi

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            runner: windows-latest
          - arch: x86
            platform: Win32
            runner: windows-latest
          - arch: arm64
            platform: ARM64
            # Native ARM64 host, so the unit tests run here rather than the
            # build only proving that the tree compiles and links.
            runner: windows-11-vs2026-arm

    steps:
      - uses: actions/checkout@v7

      # No -G: the default generator follows whichever Visual Studio the runner
      # image ships, so a new image does not break the build.
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: .\build\Release\npps3_tests.exe

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $name = "NppS3-$env:VERSION-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "pkg/$name" | Out-Null
          Copy-Item build/Release/NppS3.dll "pkg/$name/"
          Copy-Item LICENSE* "pkg/$name/" -ErrorAction SilentlyContinue
          # Plugins Admin expects the DLL at the root of the archive.
          Compress-Archive -Path "pkg/$name/*" -DestinationPath "pkg/$name.zip"
          $hash = (Get-FileHash "pkg/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "pkg/$name.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: |
            pkg/*.zip
            pkg/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          notes=$(cat <<'EOF'
          ## Install

          Copy `NppS3.dll` into the Notepad++ plugins folder, in a directory of the same name:

          ```
          <Notepad++>\plugins\NppS3\NppS3.dll
          ```

          Pick the archive matching your Notepad++ build (x64, x86 or arm64).
          The `.sha256` files carry the checksum of each archive.
          EOF
          )
          # gh creates the tag at this commit; no separate tag push is needed.
          gh release create "v$VERSION" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "NppS3 v$VERSION" \
            --notes "$notes"
